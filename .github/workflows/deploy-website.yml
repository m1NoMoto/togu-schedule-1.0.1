name: Deploy TOGU Schedule Website to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Source Files
        run: |
          mkdir -p src
          if [ ! -f "src/main.tsx" ]; then
            cat << 'EOF' > src/main.tsx
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App.tsx'
          import './index.css'

          ReactDOM.createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
          EOF
          fi
          if [ ! -f "src/index.css" ]; then
            echo '@tailwind base; @tailwind components; @tailwind utilities;' > src/index.css
          fi
          if [ ! -f "src/App.tsx" ] && [ -f "App.tsx" ]; then
            cp App.tsx src/App.tsx
          fi

      - name: Build Website Bundle
        run: npx vite build --base=./

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
